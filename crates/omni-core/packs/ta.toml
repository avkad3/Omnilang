# Tamil language pack.
#
# Tamil is strictly head-final: conditions end in a conditional suffix and
# verbs come last, so every statement keyword is postfix:
#   `x > 5 என்றால் { … }`   = "if x > 5 { … }"
#   `x அச்சிடு;`            = "print x;"
[pack]
code = "ta"
name = "தமிழ்"
script = "Tamil"
digits = "௦௧௨௩௪௫௬௭௮௯"
terminator = ";"

[keywords]
fn = "செயல்பாடு"          # function
let = "நிலை"              # fixed
var = "மாறி"              # variable
else = "இல்லையெனில்"      # otherwise
true = "மெய்"
false = "பொய்"
and = "மற்றும்"
or = "அல்லது"
not = "அல்ல"
int = "முழுஎண்"           # whole number
bool = "தருக்கம்"         # logic
str = "சரம்"              # string
main = "முதன்மை"

[statements]
if = { word = "என்றால்", position = "postfix" }
while = { word = "இருக்கும்வரை", position = "postfix" }   # "as long as … holds"
return = { word = "திருப்பு", position = "postfix" }
print = { word = "அச்சிடு", position = "postfix" }

# Common romanized spellings, so editors can complete a keyword from what
# people actually type on a Latin keyboard.
[romanized]
fn = ["seyalpaadu", "seyalpadu"]
let = ["nilai"]
var = ["maari", "maRi", "mari"]
else = ["illaiyenil", "illaiyenin"]
true = ["mei", "mey"]
false = ["poi", "poy"]
and = ["matrum", "maRRum"]
or = ["allathu", "alladhu"]
not = ["alla"]
int = ["muzhuen", "muzhuyen", "muluen"]
bool = ["tharukkam", "tarukkam"]
str = ["saram", "charam"]
main = ["muthanmai", "mudhanmai"]
if = ["endraal", "endral", "enral"]
while = ["irukkumvarai", "irukkumvarei"]
return = ["thiruppu", "tiruppu"]
print = ["achchidu", "achidu", "acchidu"]
