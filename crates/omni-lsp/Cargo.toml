[package]
name = "omni-lsp"
description = "OmniLang language server: diagnostics, transliterating completion, hover, formatting"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
omni-core = { path = "../omni-core" }
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-ident = "1"
