name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The end-to-end tests also build every example with the runner's C
      # compiler and compare native output with the interpreter.
      - run: cargo test --all

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-none-elf
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            kernel
      - name: Install QEMU and OpenSBI
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc opensbi
      - run: cargo fmt --check
        working-directory: kernel
      - run: cargo clippy -- -D warnings
        working-directory: kernel
      # Boots every language with every demo fault and checks the reports.
      - run: cargo xtask test
      - name: Panic screen screenshots
        run: |
          cargo xtask screenshot --lang hi --demo readonly -o shots/panic-hi.png
          cargo xtask screenshot --lang ta --demo load -o shots/panic-ta.png
          cargo xtask screenshot --lang en --demo panic -o shots/panic-en.png
      - uses: actions/upload-artifact@v4
        with:
          name: panic-screens
          path: shots/

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: cargo xtask grammar --check
      - run: cargo build --package omni
      - run: npm ci
        working-directory: editors/vscode
      # Launches a real VS Code with the extension and the omni server.
      - run: xvfb-run -a npm test
        working-directory: editors/vscode
      - run: npm run package
        working-directory: editors/vscode
      - uses: actions/upload-artifact@v4
        with:
          name: omnilang-vsix
          path: editors/vscode/omnilang.vsix
